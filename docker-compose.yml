# Local development stack: API + Redis. Not meant for production.
services:
  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      APP_ENV: development
      LOG_LEVEL: debug
      REDIS_URL: redis://redis:6379/0
      OTP_EXPOSE_CODE: "true"
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
