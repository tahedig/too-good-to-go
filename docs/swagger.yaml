basePath: /
definitions:
  dto.ErrorBody:
    properties:
      code:
        example: OTP_INVALID
        type: string
      details:
        type: object
      message:
        example: the verification code is incorrect
        type: string
      request_id:
        example: 3f2a9c0b7d1e4f6a8b2c4d6e8f0a1b3c
        type: string
    type: object
  dto.ErrorResponse:
    properties:
      error:
        $ref: '#/definitions/dto.ErrorBody'
    type: object
  dto.HealthCheckResult:
    properties:
      latency_ms:
        type: integer
      status:
        type: string
    type: object
  dto.HealthResponse:
    properties:
      checks:
        additionalProperties:
          $ref: '#/definitions/dto.HealthCheckResult'
        type: object
      status:
        type: string
      timestamp:
        type: string
      version:
        type: string
    type: object
  dto.MeResponse:
    properties:
      role:
        enum:
        - customer
        - vendor
        - admin
        example: customer
        type: string
      user_id:
        example: 5f0c6d1e-8b7a-4c1e-9a3f-2d4b6c8e0a12
        type: string
    type: object
  dto.RequestOTPRequest:
    properties:
      phone:
        description: Iranian local (09...), 98... or E.164 (+...) format.
        example: "09123456789"
        type: string
    type: object
  dto.RequestOTPResponse:
    properties:
      debug_code:
        description: DebugCode is present only when OTP_EXPOSE_CODE=true (never in
          production).
        example: "123456"
        type: string
      expires_in_seconds:
        example: 300
        type: integer
      message:
        example: verification code sent
        type: string
    type: object
  dto.UserResponse:
    properties:
      id:
        example: 5f0c6d1e-8b7a-4c1e-9a3f-2d4b6c8e0a12
        type: string
      phone:
        example: "+989123456789"
        type: string
      role:
        enum:
        - customer
        - vendor
        - admin
        example: customer
        type: string
    type: object
  dto.VerifyOTPRequest:
    properties:
      code:
        example: "123456"
        type: string
      phone:
        example: "09123456789"
        type: string
    type: object
  dto.VerifyOTPResponse:
    properties:
      access_token:
        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        type: string
      expires_in:
        example: 3600
        type: integer
      phone:
        example: "+989123456789"
        type: string
      token_type:
        example: Bearer
        type: string
      user:
        $ref: '#/definitions/dto.UserResponse'
      verified:
        example: true
        type: boolean
    type: object
info:
  contact: {}
  description: 'Backend API. Every error uses the same body: {"error": {"code", "message",
    "details", "request_id"}}. Clients should switch on error.code.'
  title: Too Good To Go API
  version: "0.1"
paths:
  /auth/me:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.MeResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Identity from the access token (any authenticated role)
      tags:
      - auth
  /auth/otp/request:
    post:
      consumes:
      - application/json
      description: Sends an OTP by SMS to the phone number. The code is never returned,
        except as debug_code when OTP_EXPOSE_CODE is enabled outside production.
      parameters:
      - description: Phone number
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.RequestOTPRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.RequestOTPResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "413":
          description: Request Entity Too Large
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "429":
          description: OTP_RESEND_TOO_SOON or TOO_MANY_REQUESTS; see Retry-After
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Request a one-time password
      tags:
      - auth
  /auth/otp/verify:
    post:
      consumes:
      - application/json
      description: On success the user is created (as a customer unless configured
        otherwise) or loaded, and a JWT access token is returned.
      parameters:
      - description: Phone number and code
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.VerifyOTPRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.VerifyOTPResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "413":
          description: Request Entity Too Large
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "429":
          description: OTP_ATTEMPTS_EXCEEDED or TOO_MANY_REQUESTS
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Verify a one-time password
      tags:
      - auth
  /health:
    get:
      description: 200 when the service and all its dependencies are healthy, 503
        otherwise (including during shutdown).
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.HealthResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/dto.HealthResponse'
      summary: Service health
      tags:
      - system
  /test/admin:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.MeResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Admin-only test route
      tags:
      - rbac
  /test/customer:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.MeResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Customer-only test route
      tags:
      - rbac
  /test/vendor:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.MeResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Vendor-only test route
      tags:
      - rbac
schemes:
- http
- https
securityDefinitions:
  BearerAuth:
    description: Enter "Bearer " followed by the access_token from /auth/otp/verify,
      e.g. "Bearer eyJhbGci..."
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
